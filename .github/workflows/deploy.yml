name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/beautiful-maxwell-a2p6pf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA no GitHub Pages: qualquer caminho desconhecido deve servir o app
      # (e nao a pagina 404 do GitHub).
      - run: cp dist/index.html dist/404.html
      # Publica o conteúdo de dist/ na branch gh-pages; o GitHub Pages
      # serve essa branch automaticamente.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
