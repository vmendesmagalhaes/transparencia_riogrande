name: Sonda portais RG

# Investiga a fundo transparencia.riogrande.rs.gov.br (app AngularJS que
# CARREGA, sem WAF) e riogrande.ccanet.com.br/transparencia. Objetivo:
# achar as APIs REST que alimentam esses portais. Temporario.

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Mapear transparencia.riogrande (AngularJS)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          G() { curl -s --compressed -A "$UA" -H "Accept-Language: pt-BR" "$@"; }
          mkdir -p out/js

          echo "=== destino final do redirect ==="
          G -sL -o out/index.html -w "FINAL=%{url_effective}\nHTTP=%{http_code}\nSIZE=%{size_download}\n" --max-time 40 "https://transparencia.riogrande.rs.gov.br/"
          BASE=$(G -sLI -o /dev/null -w "%{url_effective}" --max-time 40 "https://transparencia.riogrande.rs.gov.br/")
          BASE="${BASE%/}"; echo "BASE detectada: $BASE"

          echo "=== todos os scripts referenciados ==="
          grep -oE 'src="[^"]+\.js[^"]*"' out/index.html | sed 's/src="//;s/"$//' | sort -u | tee out/scripts.txt

          echo "=== baixando controllers + services e procurando APIs ==="
          i=0
          while read -r s; do
            [ -z "$s" ] && continue
            i=$((i+1))
            case "$s" in
              http*) url="$s" ;;
              /*)    url="https://transparencia.riogrande.rs.gov.br$s" ;;
              *)     url="$BASE/$s" ;;
            esac
            G --max-time 40 "$url" -o "out/js/$i.js" || true
          done < out/scripts.txt
          echo "--- chamadas \$http / endpoints nos JS ---"
          grep -ohE "(\\\$http|\\.get|\\.post)\(['\"][^'\"]+['\"]" out/js/*.js 2>/dev/null | sort -u | head -80 || true
          echo "--- strings com cara de rota de API ---"
          grep -ohE "['\"][a-zA-Z0-9_./-]*(api|rest|service|ws|consulta|receita|despesa|servidor|remunera|licita|empenho|dados)[a-zA-Z0-9_./-]*['\"]" out/js/*.js 2>/dev/null | sort -u | head -120 || true
          echo "--- URLs absolutas ---"
          grep -ohE 'https?://[a-zA-Z0-9.:/_-]+' out/js/*.js 2>/dev/null | sort -u | head -40 || true
          echo "--- arquivos de config (appsettings/environment) ---"
          grep -ohE "(baseUrl|apiUrl|urlApi|endpoint|webApi)[\"']?\s*[:=]\s*[\"'][^\"']+[\"']" out/js/*.js 2>/dev/null | sort -u | head -40 || true

      - name: Testar API do transparencia.riogrande
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          api() { curl -s --compressed -A "$UA" -H "Accept: application/json, text/plain, */*" -H "Accept-Language: pt-BR" -H "Referer: https://transparencia.riogrande.rs.gov.br/" "$@"; }
          for p in \
            "/api/exercicios" "/api/receita" "/api/despesa" "/api/servidores" \
            "/service/exercicios" "/services/exercicios" \
            "/ws/exercicios" "/rest/exercicios" \
            "/api/parametros" "/api/entidades" "/api/configuracoes" ; do
            out=$(api -o /tmp/r.json -w "%{http_code} %{content_type}" --max-time 25 "https://transparencia.riogrande.rs.gov.br$p" || echo ERR)
            echo "$out  $p  ($(wc -c < /tmp/r.json 2>/dev/null) b)"
            head -c 160 /tmp/r.json 2>/dev/null; echo ""
          done

      - name: Investigar ccanet
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          G() { curl -s --compressed -A "$UA" -H "Accept-Language: pt-BR" "$@"; }
          echo "=== ccanet transparencia ==="
          G -sL -o out/cca.html -w "FINAL=%{url_effective} HTTP=%{http_code} SIZE=%{size_download}\n" --max-time 40 "http://riogrande.ccanet.com.br/transparencia" || true
          echo "--- links/forms/scripts ---"
          grep -oiE '(href|action|src)="[^"]+"' out/cca.html 2>/dev/null | sort -u | head -60 || true
          echo "--- procura export CSV/XLS/JSON ---"
          grep -oiE 'href="[^"]*(csv|xls|json|export|download|arquivo)[^"]*"' out/cca.html 2>/dev/null | sort -u | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: sonda-portais2
          path: out/
          if-no-files-found: ignore
