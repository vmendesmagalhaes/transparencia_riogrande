name: Sonda portais RG

# Confirma extracao da lista completa de servidores e tenta remuneracao
# (salarios) com referencia. Temporario.

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Handshake + servidores completos + remuneracao
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          B="https://transparencia.riogrande.rs.gov.br/rhsysportaltransp"
          J=/tmp/jar.txt; rm -f $J
          cj() { curl -s --compressed -A "$UA" -c $J -b $J -H "Accept-Language: pt-BR" -H "Referer: $B/" "$@"; }
          api() { cj -H "Accept: application/json, text/plain, */*" "$@"; }

          echo "=== handshake ==="
          cj -o /dev/null --max-time 30 "$B/"
          api --max-time 30 "$B/api/tracking/check-config" -o /tmp/cc.json
          cat /tmp/cc.json; echo ""

          echo "=== relacaoservidores rows alto (uma chamada) ==="
          code=$(api -w "%{http_code}" --max-time 60 "$B/api/relacaoservidores?page=1&rows=10000" -o /tmp/srv.json)
          echo "HTTP=$code SIZE=$(wc -c < /tmp/srv.json)"
          node -e "const d=require('/tmp/srv.json'); console.log('count:',d.count,'| recebidos:',d.dados.length); console.log('campos:',Object.keys(d.dados[0]).join(', '));"

          echo "=== filtros de remuneracao (referencia/competencia) ==="
          for p in "/api/remuneracaoportal/filtro/referencia" "/api/lov/referencia" "/api/remuneracaoportal/filtro/orgao"; do
            code=$(api -w "%{http_code}" --max-time 30 "$B$p" -o /tmp/f.json)
            echo ">>> $p -> $code ($(wc -c < /tmp/f.json) b)"
            head -c 600 /tmp/f.json; echo ""; echo "----"
          done

          echo "=== remuneracaoportal com referencia descoberta ==="
          REF=$(node -e "try{const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/f.json'));const a=d.dados||d.items||d;const v=Array.isArray(a)?a[0]:null;process.stdout.write(String(v&&(v.id||v.valor||v.codigo||v.referencia)||''))}catch(e){process.stdout.write('')}")
          echo "REF candidata do ultimo filtro: '$REF'"
          for qs in "?referencia=$REF&page=1&rows=3" "?competencia=$REF&page=1&rows=3" "?idReferencia=$REF&page=1&rows=3"; do
            code=$(api -w "%{http_code}" --max-time 30 "$B/api/remuneracaoportal$qs" -o /tmp/r.json)
            echo ">>> remuneracaoportal$qs -> $code ($(wc -c < /tmp/r.json) b)"
            head -c 400 /tmp/r.json; echo ""; echo "----"
          done

          echo "=== agregacao de amostra (por vinculo e orgao) ==="
          node -e "
            const d=require('/tmp/srv.json');
            const by=(k)=>{const m={};for(const s of d.dados){m[s[k]]=(m[s[k]]||0)+1}return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)};
            console.log('Total:', d.count);
            console.log('Por vinculo:', JSON.stringify(by('nmvinculo')));
            console.log('Top orgaos:', JSON.stringify(by('nmorgao')));
          "
