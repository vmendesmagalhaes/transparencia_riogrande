name: Sonda debug SICONFI

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: DEBUG_SICONFI=1 node scripts/fetch-siconfi.mjs || true
