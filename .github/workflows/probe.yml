name: Verificacao dos dados

# Workflow temporario de auditoria: confere o JSON publicado contra a API
# do SICONFI (recaptura independente) e contra numeros do IBGE para o ano
# fechado de 2024. Sera removido apos a verificacao.

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recapturar do SICONFI e comparar com o JSON publicado
        run: |
          cp public/dados/transparencia.json /tmp/publicado.json
          node scripts/fetch-siconfi.mjs
          node - <<'EOF'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/publicado.json'));
          const b = JSON.parse(fs.readFileSync('public/dados/transparencia.json'));
          const iguais = (x, y) => Math.abs(x - y) < 0.01;
          console.log('=== Recaptura independente vs publicado ===');
          console.log('Receita publicada :', a.resumo.receitaRealizada.toLocaleString('pt-BR'));
          console.log('Receita recapturada:', b.resumo.receitaRealizada.toLocaleString('pt-BR'));
          console.log('Despesa publicada :', a.resumo.despesaLiquidada.toLocaleString('pt-BR'));
          console.log('Despesa recapturada:', b.resumo.despesaLiquidada.toLocaleString('pt-BR'));
          console.log('BATEM?', iguais(a.resumo.receitaRealizada, b.resumo.receitaRealizada) &&
                                iguais(a.resumo.despesaLiquidada, b.resumo.despesaLiquidada) ? 'SIM' : 'NAO');
          EOF

      - name: Conferir ano fechado 2024 contra numeros do IBGE
        run: |
          node - <<'EOF'
          const BASE = 'https://apidatalake.tesouro.gov.br/ords/siconfi/tt';
          const ENTE = 4315602;
          const norm = (s) => (s ?? '').toString().toUpperCase().trim();
          const pega = (itens, conta, col) => {
            const i = itens.find((x) => norm(x.conta) === norm(conta) && norm(x.coluna).includes(norm(col)));
            return i ? Number(i.valor) : 0;
          };
          async function rreo(anexo) {
            const u = `${BASE}/rreo?an_exercicio=2024&nr_periodo=6&co_tipo_demonstrativo=RREO&no_anexo=${encodeURIComponent(anexo)}&id_ente=${ENTE}`;
            const r = await fetch(u); const j = await r.json(); return j.items ?? [];
          }
          (async () => {
            const a1 = await rreo('RREO-Anexo 01');
            const a2 = await rreo('RREO-Anexo 02');
            const recExc = pega(a1, 'RECEITAS (EXCETO INTRA-ORÇAMENTÁRIAS) (I)', 'Até o Bimestre');
            const recIntra = pega(a1, 'RECEITAS (INTRA-ORÇAMENTÁRIAS) (II)', 'Até o Bimestre');
            const despExcLiq = pega(a2, 'DESPESAS (EXCETO INTRA-ORÇAMENTÁRIAS) (I)', 'LIQUIDADAS ATÉ O BIMESTRE');
            const despIntraLiq = pega(a2, 'DESPESAS (INTRA-ORÇAMENTÁRIAS) (II)', 'LIQUIDADAS ATÉ O BIMESTRE');
            const despExcEmp = pega(a2, 'DESPESAS (EXCETO INTRA-ORÇAMENTÁRIAS) (I)', 'EMPENHADAS ATÉ O BIMESTRE');
            const despIntraEmp = pega(a2, 'DESPESAS (INTRA-ORÇAMENTÁRIAS) (II)', 'EMPENHADAS ATÉ O BIMESTRE');
            const f = (v) => 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            console.log('=== SICONFI 2024 fechado (6o bim) — Rio Grande/RS ===');
            console.log('Receita exceto intra:', f(recExc));
            console.log('Receita total (com intra):', f(recExc + recIntra));
            console.log('Despesa liquidada exceto intra:', f(despExcLiq));
            console.log('Despesa liquidada total (com intra):', f(despExcLiq + despIntraLiq));
            console.log('Despesa empenhada total (com intra):', f(despExcEmp + despIntraEmp));
            console.log('');
            console.log('=== Referencia independente (IBGE Cidades, 2024) ===');
            console.log('Receitas brutas realizadas: R$ 1.297.938.688,55');
            console.log('Despesas brutas empenhadas: R$ 1.065.264.520,46');
            const difRec = Math.abs((recExc + recIntra) - 1297938688.55) / 1297938688.55 * 100;
            const difDesp = Math.abs((despExcEmp + despIntraEmp) - 1065264520.46) / 1065264520.46 * 100;
            console.log('');
            console.log(`Diferenca receita vs IBGE: ${difRec.toFixed(2)}%`);
            console.log(`Diferenca despesa (empenhada) vs IBGE: ${difDesp.toFixed(2)}%`);
          })();
          EOF
