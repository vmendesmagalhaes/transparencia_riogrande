name: Sonda portais RG

# Entende como a sessao do rhsysportaltransp e criada (token/cookie/captcha)
# e tenta o handshake completo para acessar os dados publicos. Temporario.

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Ler config/services para achar token/sessao/interceptor
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          B="https://transparencia.riogrande.rs.gov.br/rhsysportaltransp"
          G() { curl -s --compressed -A "$UA" -H "Accept-Language: pt-BR" "$@"; }
          for c in app.config.js app.values.js services/tracking.service.js services/services.module.js; do
            echo "===================== $c ====================="
            G --max-time 40 "$B/$c?v=4.3.1" | tr ';,' '\n\n' | grep -iE "token|sessao|sess|header|interceptor|cookie|register|recaptcha|x-|authorization|config\(" | head -50 || true
          done

      - name: Handshake completo (cookie jar) e tentar dados
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          B="https://transparencia.riogrande.rs.gov.br/rhsysportaltransp"
          J=/tmp/jar.txt; rm -f $J
          cj() { curl -s --compressed -A "$UA" -c $J -b $J -H "Accept-Language: pt-BR" -H "Referer: $B/" "$@"; }

          echo "=== 1) GET app (pega cookies iniciais) ==="
          cj -o /dev/null -D /tmp/h1.txt -w "HTTP=%{http_code}\n" --max-time 30 "$B/"
          grep -i "set-cookie" /tmp/h1.txt || echo "(sem set-cookie no GET inicial)"

          echo "=== 2) GET api/tracking/check-config ==="
          cj -D /tmp/h2.txt -w "HTTP=%{http_code}\n" --max-time 30 "$B/api/tracking/check-config" -o /tmp/cc.json
          grep -i "set-cookie" /tmp/h2.txt || echo "(sem set-cookie)"
          head -c 400 /tmp/cc.json; echo ""

          echo "=== 3) POST api/tracking/register-user (varios corpos) ==="
          for body in '{}' '{"aceitouTermos":true}' '{"identificado":false}' '{"tipoUsuario":"ANONIMO"}'; do
            code=$(cj -X POST -H "Content-Type: application/json" -d "$body" -D /tmp/h3.txt -w "%{http_code}" --max-time 30 "$B/api/tracking/register-user" -o /tmp/ru.json)
            echo ">>> body=$body -> $code"
            grep -i "set-cookie" /tmp/h3.txt || true
            head -c 300 /tmp/ru.json; echo ""
          done

          echo "=== 4) Tentar dados novamente (com cookies do handshake) ==="
          for p in "/api/remuneracaoportal/metadados" "/api/remuneracaoportal?page=1&rows=3" "/api/relacaoservidores?page=1&rows=3"; do
            code=$(cj -H "Accept: application/json, text/plain, */*" -w "%{http_code}" --max-time 30 "$B$p" -o /tmp/d.json)
            echo ">>> $p -> $code ($(wc -c < /tmp/d.json) b)"
            head -c 500 /tmp/d.json; echo ""; echo "----"
          done

          echo "=== 5) Cookies finais no jar ==="
          cat $J | grep -v '^#' || echo "(jar vazio)"
