name: Sonda - mapear APIs do portal GRP

# Workflow temporario de diagnostico: roda nos servidores do GitHub (que tem
# acesso livre a internet) para descobrir os endpoints de dados do portal
# GRP da Prefeitura. Sera removido apos o mapeamento.

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar pagina inicial do portal GRP
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36"
          echo "=== HTTP status das tres fontes ==="
          for u in \
            "https://grp.riogrande.rs.gov.br/transparencia/prefeitura/" \
            "https://transparencia.riogrande.rs.gov.br/" \
            "https://www.riogrande.rs.gov.br/consulta/index.php/portal-transparencia"; do
            code=$(curl -sk -A "$UA" -o /dev/null -w "%{http_code}" --max-time 30 "$u" || echo ERR)
            echo "$code  $u"
          done

          echo "=== HTML da pagina do GRP (primeiros 200 linhas) ==="
          curl -sk -A "$UA" --max-time 30 "https://grp.riogrande.rs.gov.br/transparencia/prefeitura/" -o index.html || true
          head -200 index.html || true

          echo "=== Scripts referenciados ==="
          grep -oE 'src="[^"]+\.js[^"]*"' index.html | sort -u || true
          grep -oE 'href="[^"]+\.(js|json)[^"]*"' index.html | sort -u || true

      - name: Baixar bundles JS e procurar caminhos de API
        run: |
          UA="Mozilla/5.0"
          BASE="https://grp.riogrande.rs.gov.br/transparencia/prefeitura"
          mkdir -p js
          i=0
          for s in $(grep -oE 'src="[^"]+\.js[^"]*"' index.html | sed 's/src="//; s/"$//'); do
            i=$((i+1))
            case "$s" in
              http*) url="$s" ;;
              /*)    url="https://grp.riogrande.rs.gov.br$s" ;;
              *)     url="$BASE/$s" ;;
            esac
            echo "Baixando: $url"
            curl -sk -A "$UA" --max-time 60 "$url" -o "js/$i.js" || true
          done
          echo "=== Possiveis endpoints encontrados nos bundles ==="
          grep -ohE '"[^"]*(api|rest|servico|service|consulta)[^"]*"' js/*.js 2>/dev/null | sort -u | head -100 || true
          echo "=== URLs absolutas nos bundles ==="
          grep -ohE 'https?://[a-zA-Z0-9./_-]+' js/*.js 2>/dev/null | sort -u | head -50 || true

      - name: Testar caminhos comuns de API do GRP
        run: |
          UA="Mozilla/5.0"
          echo "=== Status de caminhos candidatos ==="
          for p in \
            "/transparencia/api/receita" \
            "/transparencia/api/despesa" \
            "/transparencia/api/licitacao" \
            "/transparencia/servicos/transparencia/receitas" \
            "/transparencia/rest/receita" \
            "/grp/transparencia/api" \
            "/transparencia/api"; do
            code=$(curl -sk -A "$UA" -o /dev/null -w "%{http_code}" --max-time 20 "https://grp.riogrande.rs.gov.br$p" || echo ERR)
            echo "$code  $p"
          done

      - name: Guardar HTML e bundles como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sonda-grp
          path: |
            index.html
            js/
          if-no-files-found: ignore
