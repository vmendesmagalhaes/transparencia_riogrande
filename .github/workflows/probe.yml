name: Sonda diarias

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Varrer todas as competencias de diarias
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          B="https://transparencia.riogrande.rs.gov.br/rhsysportaltransp"
          J=/tmp/jar.txt; rm -f $J
          cj() { curl -s --compressed -A "$UA" -c $J -b $J -H "Accept-Language: pt-BR" -H "Referer: $B/" "$@"; }
          api() { cj -H "Accept: application/json, text/plain, */*" "$@"; }

          cj -o /dev/null --max-time 30 "$B/"
          api --max-time 30 "$B/api/tracking/check-config" -o /dev/null
          api --max-time 30 "$B/api/lov/referencia" -o /tmp/ref.json

          echo "=== total de competencias disponiveis ==="
          node -e "const d=require('/tmp/ref.json'); console.log((d.dados||[]).length, 'competencias; mais antiga:', (d.dados||[]).slice(-1)[0]?.descricao)"

          echo "=== consultando diarias em CADA competencia (referencia) ==="
          ENC=$(node -e "const d=require('/tmp/ref.json'); (d.dados||[]).forEach(x=>console.log(x.descricao+'|'+encodeURIComponent(x.codigo)))")
          ACHOU=0
          while IFS='|' read -r desc code; do
            [ -z "$code" ] && continue
            api -w "" --max-time 30 "$B/api/consultadiarias?referencia=$code&page=1&rows=5" -o /tmp/d.json
            c=$(node -e "try{console.log(require('/tmp/d.json').count)}catch(e){console.log('err')}")
            echo "$desc -> count=$c"
            if [ "$c" != "0" ] && [ "$c" != "err" ]; then
              ACHOU=1
              echo "    >>> TEM DADOS! amostra:"
              head -c 900 /tmp/d.json; echo ""
            fi
          done <<< "$ENC"
          echo "=== ALGUMA COMPETENCIA COM DIARIAS? ACHOU=$ACHOU ==="
