name: Sonda SICONFI

# Workflow temporario: baixa amostras da API aberta do SICONFI (Tesouro
# Nacional) para Rio Grande/RS e mostra a estrutura, para eu escrever o
# transformador com os nomes de campo corretos. Sera removido depois.

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar SICONFI para Rio Grande/RS (id_ente 4315602)
        run: |
          BASE="https://apidatalake.tesouro.gov.br/ords/siconfi/tt"
          ENTE=4315602
          mkdir -p out

          echo "############ RREO Anexo 01 (Balanco Orcamentario) 2024 p6 ############"
          curl -s "$BASE/rreo?an_exercicio=2024&nr_periodo=6&co_tipo_demonstrativo=RREO&no_anexo=RREO-Anexo%2001&id_ente=$ENTE" -o out/rreo_anexo01.json
          echo "Tamanho: $(wc -c < out/rreo_anexo01.json) bytes"
          echo "--- 1 item de exemplo ---"
          python3 -c "import json;d=json.load(open('out/rreo_anexo01.json'));print('total items:',len(d.get('items',[])));print(json.dumps(d['items'][0],ensure_ascii=False,indent=2)) if d.get('items') else print('SEM ITEMS:',json.dumps(d,ensure_ascii=False)[:500])"
          echo "--- colunas distintas (campo coluna) ---"
          python3 -c "import json;d=json.load(open('out/rreo_anexo01.json'));print(sorted({i.get('coluna','') for i in d.get('items',[])}))"
          echo "--- contas distintas (campo conta) primeiras 40 ---"
          python3 -c "import json;d=json.load(open('out/rreo_anexo01.json'));xs=sorted({i.get('conta','') for i in d.get('items',[])});[print(x) for x in xs[:40]]"

          echo "############ RREO Anexo 02 (Despesa por Funcao) 2024 p6 ############"
          curl -s "$BASE/rreo?an_exercicio=2024&nr_periodo=6&co_tipo_demonstrativo=RREO&no_anexo=RREO-Anexo%2002&id_ente=$ENTE" -o out/rreo_anexo02.json
          echo "Tamanho: $(wc -c < out/rreo_anexo02.json) bytes"
          python3 -c "import json;d=json.load(open('out/rreo_anexo02.json'));print('total items:',len(d.get('items',[])));print(json.dumps(d['items'][0],ensure_ascii=False,indent=2)) if d.get('items') else print('SEM ITEMS')"
          echo "--- colunas distintas ---"
          python3 -c "import json;d=json.load(open('out/rreo_anexo02.json'));print(sorted({i.get('coluna','') for i in d.get('items',[])}))"
          echo "--- contas (funcoes) distintas ---"
          python3 -c "import json;d=json.load(open('out/rreo_anexo02.json'));xs=sorted({i.get('conta','') for i in d.get('items',[])});[print(x) for x in xs[:60]]"

      - uses: actions/upload-artifact@v4
        with:
          name: sonda-siconfi
          path: out/
          if-no-files-found: ignore
