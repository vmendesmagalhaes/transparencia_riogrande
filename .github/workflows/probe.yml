name: Sonda portais RG

# Testa a API REAL do portal de pessoal rhsysportaltransp (sem WAF) e le os
# controllers para descobrir os parametros. Temporario.

on:
  push:
    branches: [claude/beautiful-maxwell-a2p6pf]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Ler controllers (parametros das chamadas)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          B="https://transparencia.riogrande.rs.gov.br/rhsysportaltransp"
          G() { curl -s --compressed -A "$UA" -H "Accept-Language: pt-BR" "$@"; }
          for c in relacaoservidores/relacaoservidores.controller.js remuneracaoportal/remuneracaoportal.controller.js services/services.module.js; do
            echo "===================== $c ====================="
            G --max-time 40 "$B/$c?v=4.3.1" | tr ';' '\n' | grep -iE "api/|\\\$http|params|exercicio|competenc|mes|ano|page|rows|filtro" | head -40 || true
          done

      - name: Testar a API real (base /rhsysportaltransp/api)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          B="https://transparencia.riogrande.rs.gov.br/rhsysportaltransp"
          api() { curl -s --compressed -A "$UA" -H "Accept: application/json, text/plain, */*" -H "Accept-Language: pt-BR" -H "Referer: $B/" "$@"; }
          mkdir -p out
          for p in \
            "/api/traducao" \
            "/api/remuneracaoportal/metadados" \
            "/api/filtros/" \
            "/api/lov/" \
            "/api/relacaoservidores" \
            "/api/relacaoservidores/folha" \
            "/api/remuneracaoportal" \
            "/api/consultadiarias" ; do
            code=$(api -o "out/resp.json" -w "%{http_code} %{content_type}" --max-time 30 "$B$p")
            echo ">>> $p  -> $code  ($(wc -c < out/resp.json) bytes)"
            head -c 700 out/resp.json; echo ""; echo "----"
          done

      - name: Testar remuneracaoportal com parametros comuns
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          B="https://transparencia.riogrande.rs.gov.br/rhsysportaltransp"
          api() { curl -s --compressed -A "$UA" -H "Accept: application/json, text/plain, */*" -H "Referer: $B/" "$@"; }
          for qs in \
            "?page=1&rows=5" \
            "?competencia=202604&page=1&rows=5" \
            "?anoMes=202604&page=1&rows=5" \
            "?exercicio=2026&mes=4&page=1&rows=5" \
            "?ano=2026&mes=4&page=1&rows=5" ; do
            code=$(api -o out/r.json -w "%{http_code}" --max-time 30 "$B/api/remuneracaoportal$qs")
            echo ">>> remuneracaoportal$qs -> $code ($(wc -c < out/r.json) b)"
            head -c 500 out/r.json; echo ""; echo "----"
          done
          echo "===== relacaoservidores com paginacao ====="
          for qs in "?page=1&rows=5" "?exercicio=2026&page=1&rows=5"; do
            code=$(api -o out/r.json -w "%{http_code}" --max-time 30 "$B/api/relacaoservidores$qs")
            echo ">>> relacaoservidores$qs -> $code ($(wc -c < out/r.json) b)"
            head -c 500 out/r.json; echo ""; echo "----"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sonda-api
          path: out/
          if-no-files-found: ignore
